    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #searchContainer {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #f80c0c;
            /* Change the background color as needed */
            display: flex;
            align-items: center;
            height: 50px;
            z-index: 1000;
            /* Set a high z-index to make sure it's on top of other elements */
        }

        #searchInput {
            padding: 10px;
            font-size: 16px;
            flex: 1;
            border: none;
            /* Remove border */
            border-radius: 0;
            /* Remove border radius */
            outline: none;
        }

        #searchButton {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #d83e23;
            color: #fff;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: 0.4s;
        }

        #searchButton:hover {
            opacity: 75%;
        }

        #result-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 1;
        }

        #suggestions .suggestion {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #suggestions .suggestion:last-child {
            border-bottom: none;
        }

        #suggestions .suggestion:hover {
            background-color: #d2d7d8;
        }

        .search-result {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 10px;
            max-width: 600px;
            text-align: left;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease-in-out;
            display: flex;
            align-items: flex-start;
        }

        .search-result:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .text-content {
            flex: 1;
            user-select: none;
        }

        .text-content h2 {
            margin-bottom: 10px;
        }

        .text-content p {
            margin-bottom: 15px;
        }

        .search-result img {
            max-width: 150px;
            height: auto;
            margin-left: auto;
            user-select: none;
        }

        #no-results {
            color: #555;
            margin-top: 20px;
        }

        .additional-info {
            margin-top: 15px;
            text-align: center;
        }
    </style>

</head>

        let currentSearchTerm = "";

        function search() {
            var searchTerm = document.getElementById("searchInput").value;
            var resultContainer = document.getElementById("result-container");
            var suggestionsContainer = document.getElementById("suggestions");

            resultContainer.innerHTML = ""; // Clear previous results
            suggestionsContainer.innerHTML = ""; // Clear previous suggestions

            // If the search term is different, update suggestions
            if (currentSearchTerm !== searchTerm) {
                showSuggestions(searchTerm);
                currentSearchTerm = searchTerm;
                return;
            }

            // Fuzzy search options
            var fuseOptions = {
                keys: ["itemID"],
                threshold: 0.4, // Adjust the threshold based on your preferences
            };

            var fuse = new Fuse(Object.values(itemData), fuseOptions);
            var searchResults = fuse.search(searchTerm);

            if (searchResults.length > 0) {
                // Display the closest match
                var closestMatch = searchResults[0].item;
                displayResult(closestMatch);

                // Update the URL with the closest match
                window.location.hash = "#" + closestMatch.itemID;
            } else {
                // No exact match, show suggestions
                showSuggestions(searchTerm);
            }
        }

        function handleInput() {
            var searchTerm = document.getElementById("searchInput").value;
            var suggestionsContainer = document.getElementById("suggestions");
            var resultContainer = document.getElementById("result-container");

            // Show/hide suggestions based on input
            if (searchTerm.trim() !== "") {
                showSuggestions(searchTerm);
            } else {
                suggestionsContainer.style.display = "none";
                resultContainer.style.marginTop = "20px";
            }
        }

        function showSuggestions(searchTerm) {
            var suggestionsContainer = document.getElementById("suggestions");
            var searchInput = document.getElementById("searchInput");
            var fuseOptions = {
                keys: ["itemID"],
                threshold: 0.4,
            };

            var fuse = new Fuse(Object.values(itemData), fuseOptions);
            var searchResults = fuse.search(searchTerm);

            suggestionsContainer.innerHTML = ""; // Clear previous suggestions

            if (searchResults.length > 0) {
                // Filter suggestions to show only if the search term matches the beginning
                var filteredResults = searchResults.filter(result => result.item.itemID.toLowerCase().startsWith(searchTerm.toLowerCase()));

                if (filteredResults.length > 0) {
                    // Display suggestions
                    suggestionsContainer.style.display = "block";
                    suggestionsContainer.style.width = searchInput.offsetWidth + "px"; // Set width

                    var suggestionDiv = document.createElement("div");

                    filteredResults.forEach(result => {
                        var suggestionP = document.createElement("p");
                        suggestionP.classList.add("suggestion");

                        // Bold the matched characters
                        var regex = new RegExp(`(${searchTerm})`, 'i');
                        suggestionP.innerHTML = result.item.itemID.replace(regex, '<strong>$1</strong>');

                        suggestionP.addEventListener("click", function () {
                            searchInput.value = result.item.itemID;
                            suggestionsContainer.style.display = "none";
                            search();
                        });
                        suggestionDiv.appendChild(suggestionP);
                    });

                    suggestionsContainer.appendChild(suggestionDiv);

                    // Position the suggestions below the search input
                    var rect = searchInput.getBoundingClientRect();
                    suggestionsContainer.style.left = rect.left + "px";
                    suggestionsContainer.style.top = rect.bottom + "px";
                } else {
                    suggestionsContainer.style.display = "none";
                }
            } else {
                suggestionsContainer.style.display = "none";
            }
        }

        function displayResult(item) {
            var resultContainer = document.getElementById("result-container");
            var resultDiv = document.createElement("div");
            resultDiv.classList.add("search-result");

            var textContentDiv = document.createElement("div");
            textContentDiv.classList.add("text-content");

            var titleElement = document.createElement("h2");
            titleElement.textContent = item.title;

            var descriptionElement = document.createElement("p");
            descriptionElement.textContent = item.description;

            var additionalInfoDiv = document.createElement("div");
            additionalInfoDiv.classList.add("additional-info");

            var buyPriceElement = document.createElement("p");
            buyPriceElement.textContent = "Buy Price: " + item.buyPrice;

            var sellPriceElement = document.createElement("p");
            sellPriceElement.textContent = "Sell Price: " + item.sellPrice;

            var typeElement = document.createElement("p");
            typeElement.textContent = "Type: " + item.type;

            var itemIDElement = document.createElement("p");
            itemIDElement.textContent = "Item ID: " + item.itemID;

            additionalInfoDiv.appendChild(buyPriceElement);
            additionalInfoDiv.appendChild(sellPriceElement);
            additionalInfoDiv.appendChild(typeElement); // Adding the type information
            additionalInfoDiv.appendChild(itemIDElement);

            textContentDiv.appendChild(titleElement);
            textContentDiv.appendChild(descriptionElement);
            textContentDiv.appendChild(additionalInfoDiv);

            var imageElement = document.createElement("img");
            imageElement.src = item.image;
            imageElement.alt = item.title;
            imageElement.draggable = false;

            resultDiv.appendChild(textContentDiv);
            resultDiv.appendChild(imageElement);

            resultContainer.appendChild(resultDiv);

            document.getElementById("no-results").style.display = "none";
        }


        document.getElementById("searchInput").addEventListener("keyup", function (event) {
            if (event.key === "Enter") {
                search();
                console.log(closestMatch.itemID);
                searchInput.textContent = ""
            } else {
                // Show suggestions while typing
                showSuggestions(this.value);
            }
        });

        // Check for hash in the URL and show item info if present
        window.onload = function () {
            var hash = window.location.hash.substr(1);
            if (hash && itemData.hasOwnProperty(hash)) {
                displayResult(itemData[hash]);
            }
        };

        // Update the URL on search
        function updateURL(searchTerm) {
            window.location.hash = "#" + searchTerm;
        }
        document.getElementById("searchInput").addEventListener("keydown", function (event) {
            var suggestionsContainer = document.getElementById("suggestions");
            var currentSearchTerm = "";
            var selectedSuggestionIndex = -1;

            if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault(); // Prevents the cursor from moving in the input field
                handleArrowKeyPress(event.key);
            } else if (event.key === "Enter") {
                event.preventDefault(); // Prevents the form from being submitted
                handleEnterKeyPress();
            }
        });

        function handleArrowKeyPress(key) {
            var suggestionsContainer = document.getElementById("suggestions");
            var suggestionElements = suggestionsContainer.children;

            if (suggestionElements.length === 0) {
                return;
            }

            if (key === "ArrowDown") {
                selectedSuggestionIndex = (selectedSuggestionIndex + 1) % suggestionElements.length;
            } else if (key === "ArrowUp") {
                selectedSuggestionIndex = (selectedSuggestionIndex - 1 + suggestionElements.length) % suggestionElements.length;
            }

            highlightSelectedSuggestion();
            scrollSuggestionIntoView();
        }

        function scrollSuggestionIntoView() {
            var suggestionsContainer = document.getElementById("suggestions");
            var suggestionElements = suggestionsContainer.children;

            if (selectedSuggestionIndex !== -1) {
                var selectedSuggestion = suggestionElements[selectedSuggestionIndex];
                selectedSuggestion.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest",
                });
            }
        }

        // Rest of the code remains unchanged

        function highlightSelectedSuggestion() {
            var suggestionsContainer = document.getElementById("suggestions");

            var suggestionElements = suggestionsContainer.children;

            for (var i = 0; i < suggestionElements.length; i++) {
                suggestionElements[i].classList.remove("selected");
            }
            var currentSearchTerm = "";
            var selectedSuggestionIndex = -1
            if (selectedSuggestionIndex !== -1) {
                suggestionElements[selectedSuggestionIndex].classList.add("selected");
            }
        }
