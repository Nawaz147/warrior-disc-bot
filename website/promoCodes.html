<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .promo-container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        p {
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
        }

        @media only screen and (max-width: 1000px) {
            .promo-container {
                width: 95%;
            }
        }

        @media only screen and (max-width: 900px) {
            .promo-container {
                width: 90%;
            }
        }

        @media only screen and (max-width: 800px) {
            .promo-container {
                width: 85%;
            }
        }

        @media only screen and (max-width: 700px) {
            .promo-container {
                width: 80%;
            }
        }

        @media only screen and (max-width: 600px) {
            .promo-container {
                width: 85%;
                padding: 10px;
            }
        }

        @media only screen and (max-width: 500px) {
            .promo-container {
                width: 80%;
            }
        }

        @media only screen and (max-width: 400px) {
            .promo-container {
                width: 80%;
            }
        }

        @media only screen and (max-width: 300px) {
            .promo-container {
                width: 70%;
            }
        }

        @media only screen and (max-width: 200px) {
            .promo-container {
                width: 60%;
            }
        }
    </style>
</head>

<body>
    <div class="promo-container">
        <h2>Promo Codes</h2>
        <p>Use promo code E9XPO3 to get 5x Elite Awakening Gems.</p>
        <p>Use promo code GZ3POV to get 5x Awakening Gems.</p>
        <p>Use promo code D4CO9E to get 500,000 Gold Coins.</p>
        <p>Use promo code PXLTO8 to get 100 ruix.</p>
        <p>Use promo code 42X0ED to get 3 soldiers</p>
    </div>
</body>

</html>
