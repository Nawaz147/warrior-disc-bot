    <script>
        // Fetch the server count from your server's API
        function serverDetails() {
            // Fetch the server count from your server's API
            fetch("http://localhost:9500/serverDetails")
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const serverCountElement = document.getElementById("server-count");
                    const updateStatus = document.getElementById("updateStatus");
                    serverCountElement.textContent = `Server Count: ${data.serverCount}`;
                    updateStatus.textContent = `Update status : ${data.botUpdateStatus}`;
                })
        }

        // Fetch the server count initially
        serverDetails();

        // Fetch the server count every 1 second
        setInterval(serverDetails, 100);
